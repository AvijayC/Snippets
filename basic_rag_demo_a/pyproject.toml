[project]
name = "basic-rag-demo-a"
version = "0.1.0"
description = "Portable OpenAI-compatible RAG and database-query agent demo."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4>=4.12.3",
  "chromadb>=0.5.23",
  "fastapi>=0.115.6",
  "httpx>=0.27.0",
  "openai>=1.58.1",
  "pydantic>=2.10.4",
  "pypdf>=5.1.0",
  "python-docx>=1.1.2",
  "sqlglot>=26.1.0",
  "uvicorn[standard]>=0.34.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.4",
  "pytest-asyncio>=0.25.0",
]

[project.scripts]
rag-demo = "rag_demo.main:main"
rag-demo-sample-data = "rag_demo.sample_data:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rag_demo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
